name: Build MeshCore firmware (packet logging)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "MeshCore branch, tag or commit to build"
        default: "main"
        required: true
      release:
        description: "Also publish a GitHub release with the firmware files"
        type: boolean
        default: true

env:
  MESHCORE_REPO: meshcore-dev/MeshCore
  EXTRA_FLAGS: "-D MESH_PACKET_LOGGING=1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - Heltec_v3_repeater
          - Heltec_v3_companion_radio_ble
          - t1000e_repeater
          - t1000e_companion_radio_ble
    steps:
      - name: Check out MeshCore
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MESHCORE_REPO }}
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.env }}
        env:
          # PlatformIO appends this to the env's own build_flags
          PLATFORMIO_BUILD_FLAGS: ${{ env.EXTRA_FLAGS }}
        run: pio run -e ${{ matrix.env }}

      - name: Collect firmware files
        run: |
          mkdir -p out
          d=.pio/build/${{ matrix.env }}
          for f in "$d"/firmware*.bin "$d"/firmware*.hex "$d"/firmware*.zip "$d"/firmware*.uf2; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            cp "$f" "out/${{ matrix.env }}-packetlog-$b"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}-packetlog
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="packetlog-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "MeshCore (${{ inputs.ref }}) + MESH_PACKET_LOGGING" \
            --notes "Built from ${{ env.MESHCORE_REPO }} @ ${{ inputs.ref }} with \`${{ env.EXTRA_FLAGS }}\`."
