name: Build MeshCore firmware (packet logging)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "MeshCore branch, tag or commit to build"
        default: "main"
        required: true
      melodies:
        description: "T1000-E buzzer melodies (RTTTL), separated by |  e.g. startup:d=16,o=6,b=200:c,e,g,c7|ack:d=32,o=8,b=120:c  (empty = stock sounds)"
        type: string
        default: ""
        required: false
      release:
        description: "Also publish a GitHub release with the firmware files"
        type: boolean
        default: true

env:
  MESHCORE_REPO: meshcore-dev/MeshCore
  EXTRA_FLAGS: "-D MESH_PACKET_LOGGING=1"
  # Custom T1000-E buzzer melodies from the "melodies" input (RTTTL, separated by |)
  MELODIES: ${{ inputs.melodies }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - Heltec_v3_repeater
          - Heltec_v3_companion_radio_ble
          - t1000e_repeater
          - t1000e_companion_radio_ble
    steps:
      - name: Check out MeshCore
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MESHCORE_REPO }}
          ref: ${{ inputs.ref }}

      - name: List existing buzzer melodies (RTTTL)
        if: ${{ contains(matrix.env, 't1000e') }}
        run: grep -rnoE '"[A-Za-z0-9_]+:d=[^"]*"' src examples variants || true

      - name: Patch buzzer melodies
        if: ${{ contains(matrix.env, 't1000e') && env.MELODIES != '' }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          wanted = {}
          for line in re.split(r"[|\n]", os.environ["MELODIES"]):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              wanted[line.split(":", 1)[0]] = line
          files = [os.path.join(r, f)
                   for d in ("src", "examples", "variants")
                   for r, _, fs in os.walk(d) for f in fs
                   if f.endswith((".cpp", ".h", ".ino"))]
          missing = set(wanted)
          for path in files:
              text = open(path, encoding="utf-8", errors="ignore").read()
              new = text
              for name, rtttl in wanted.items():
                  pat = re.compile(r'"' + re.escape(name) + r':[^"]*"')
                  if pat.search(new):
                      new = pat.sub(lambda m: '"' + rtttl + '"', new)
                      missing.discard(name)
              if new != text:
                  open(path, "w", encoding="utf-8").write(new)
                  print("patched", path)
          if missing:
              sys.exit("No existing melody named: " + ", ".join(sorted(missing)))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.env }}
        env:
          # PlatformIO appends this to the env's own build_flags
          PLATFORMIO_BUILD_FLAGS: ${{ env.EXTRA_FLAGS }}
        run: pio run -e ${{ matrix.env }}

      - name: Collect firmware files
        run: |
          mkdir -p out
          d=.pio/build/${{ matrix.env }}
          for f in "$d"/firmware*.bin "$d"/firmware*.hex "$d"/firmware*.zip "$d"/firmware*.uf2; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            cp "$f" "out/${{ matrix.env }}-packetlog-$b"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}-packetlog
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="packetlog-$(date +%Y%m%d-%H%M)"
          {
            echo "Built from ${{ env.MESHCORE_REPO }} @ ${{ inputs.ref }} with \`${{ env.EXTRA_FLAGS }}\`."
            # Only mention melodies if any were set (they apply to the t1000e builds only)
            if [ -n "$(printf '%s' "$MELODIES" | tr -d '[:space:]')" ]; then
              echo
              echo "### Custom T1000-E buzzer melodies (RTTTL)"
              echo
              echo '```'
              printf '%s\n' "$MELODIES" | tr '|' '\n' | grep -vE '^[[:space:]]*(#|$)' | sed 's/^[[:space:]]*//'
              echo '```'
            fi
          } > notes.md
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "MeshCore (${{ inputs.ref }}) + MESH_PACKET_LOGGING" \
            --notes-file notes.md
